[daily_run]
target_configurations = 250
minimum_configurations = 50
maximum_configurations = 500
mechanism_ideas_minimum = 8
mechanism_ideas_maximum = 20
workers = 12
memory_limit_gb = 64
minimum_free_disk_gb = 100
scheduled_hour_et = 16
scheduled_minute_et = 30
random_seed = 20260726

[idea_generation]
enabled = true
model = "gpt-5.6-terra"
reasoning_effort = "medium"
store_responses = false
daily_budget_usd = 5.0
maximum_output_tokens = 4000
input_cost_per_million_tokens_usd = 2.5
output_cost_per_million_tokens_usd = 15.0

[dsl]
maximum_ast_depth = 4
maximum_ast_nodes = 12
maximum_tunable_values = 4

[execution]
allowed_security_types = ["COMMON", "ETF"]
allowed_horizons = ["daily", "intraday"]
maximum_concurrent_positions = 3
maximum_new_entries_per_day = 5
maximum_holding_trading_days = 5
base_round_trip_bps = 10
stress_round_trip_bps = 20
same_interval_ambiguity = "stop_first"

[pilot_risk]
maximum_planned_loss_fraction_per_position = 0.005
maximum_aggregate_planned_open_loss_fraction = 0.0125
maximum_daily_loss_fraction = 0.015
maximum_weekly_loss_fraction = 0.04
maximum_peak_to_trough_drawdown_fraction = 0.08
maximum_gross_notional_fraction = 1.0

[validation]
walk_forward_folds = 5
minimum_development_trades = 50
minimum_holdout_trades = 20
minimum_profit_factor = 1.30
minimum_stressed_profit_factor = 1.20
minimum_bootstrap_confidence = 0.90
minimum_win_rate_lower_bound = 0.50
maximum_drawdown_r = 6.0
minimum_deflated_sharpe_probability = 0.90
maximum_probability_backtest_overfit = 0.50
minimum_positive_neighbor_fraction = 0.50
maximum_holdout_promotions_per_week = 3
minimum_clean_paper_signals = 5
minimum_live_executions = 10
minimum_natural_stop_executions = 3
maximum_entry_slippage_p95_bps = 15.0
maximum_unprotected_p95_seconds = 10.0
bootstrap_samples = 2000

[bridge]
snapshot_schema_version = 1
command_schema_version = 1
active_poll_seconds = 10
idle_poll_seconds = 60
maximum_clock_skew_seconds = 300
command_ttl_seconds = 900
maximum_payload_bytes = 2097152
smartsioux_endpoint = "https://smartsioux.com/StrategyLab"
operator_email = "ryan@ensomniac.com"
operator_email_env = "STRATEGY_LAB_OPERATOR_EMAIL"
hmac_secret_env = "STRATEGY_LAB_HMAC_SECRET"
