# Human-editable project settings. Changes take effect on the next CLI call.

[notifications.email]
# off:     never send operational email
# trades:  send only trade_placed, trade_modified, and trade_completed events
# verbose: also send likely setup, critical safety, and session summary events
verbosity = "verbose"

# Transport settings for the existing server mail sender. The server routes mail
# to ryan@ensomniac.com; this API does not accept a recipient argument.
endpoint = "https://smartsioux.com/Api"
timeout_seconds = 15
subject_prefix = "[Robinhood Codex]"
