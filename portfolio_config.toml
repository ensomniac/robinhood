[campaign]
id = "multi-strategy-portfolio-validation-v1"
schema_version = 1
target_pilot_ready_strategies = 3
initial_mechanism_families = 10
maximum_initial_variants = 20
maximum_second_wave_families = 6

[portfolio]
maximum_concurrent_positions = 3
maximum_new_entries_per_day = 5
maximum_holding_trading_days = 5
maximum_ready_pairwise_correlation = 0.70
minimum_combined_confirmation_opportunity_coverage = 0.60

[pilot_risk]
maximum_planned_loss_fraction_per_position = 0.0050
maximum_aggregate_planned_open_loss_fraction = 0.0125
maximum_daily_loss_fraction = 0.0150
maximum_weekly_loss_fraction = 0.0400
maximum_peak_to_trough_drawdown_fraction = 0.0800
maximum_gross_notional_fraction = 1.00

[scaled_risk]
minimum_clean_portfolio_live_closes = 20
maximum_planned_loss_fraction_per_position = 0.0100
maximum_aggregate_planned_open_loss_fraction = 0.0200
maximum_gross_notional_fraction = 1.25
kelly_fraction = 0.25

[pilot_ready]
minimum_closed_historical_signals = 50
minimum_confirmation_signals = 20
minimum_shadow_executions = 5
minimum_expectancy_r = 0.0
minimum_confirmation_expectancy_r = 0.0
minimum_profit_factor = 1.30
minimum_bootstrap_confidence = 0.90
maximum_drawdown_r = 6.0
minimum_stressed_profit_factor = 1.20
maximum_stressed_drawdown_r = 6.0
maximum_rule_violations = 0
require_positive_chronological_halves = true
require_positive_without_five_best = true
require_complete_trial_accounting = true
require_clear_multiple_testing_audit = true
require_complete_execution_model = true

[live_validated]
minimum_live_executions = 10
minimum_natural_stop_executions = 3
maximum_entry_slippage_p95_bps = 15.0
maximum_unprotected_p95_seconds = 10.0
maximum_stop_slippage_excess_p95_bps = 0.0
maximum_rule_violations = 0

[stress]
entry_exit_bps = [10, 20]
same_interval_ambiguity = "stop_first"
